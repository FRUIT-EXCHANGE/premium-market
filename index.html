<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Премиум Маркет — Доставка в Санкт-Петербурге</title>
<meta name="description" content="Доставка премиум продуктов в Санкт-Петербурге.">
<meta name="robots" content="index, follow">
<style>
body{background:#0d1117;color:#c9d1d9;font-family:system-ui,sans-serif;margin:0}
.header{text-align:center;padding:50px 20px 30px;background:linear-gradient(135deg,#0d1117,#161b22)}
.header h1{font-size:2.5em;color:#d4af37;margin:0}
.header p{color:#8b949e;font-size:1.1em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;padding:20px;max-width:1200px;margin:0 auto}
.card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:16px;transition:transform .2s}
.card:hover{transform:translateY(-3px);border-color:#d4af37}
.card img{width:100%;height:200px;object-fit:cover;border-radius:8px}
.card h3{color:#d4af37;margin:10px 0 5px;font-size:1.1em}
.card p{color:#8b949e;font-size:.9em;margin:5px 0}
.price{color:#3fb950;font-size:1.3em;font-weight:bold}
.old{color:#484f58;text-decoration:line-through;font-size:.9em}
.badge{display:inline-block;background:#d4af3722;color:#d4af37;padding:2px 8px;border-radius:6px;font-size:.8em;margin:2px}
.footer{text-align:center;padding:40px;color:#484f58}
.loading{text-align:center;padding:60px;color:#484f58}
</style>
</head>
<body>
<div class="header"><h1>Премиум Маркет</h1><p>Доставка в Санкт-Петербурге</p></div>
<div class="grid" id="catalog"><div class="loading">Загрузка каталога...</div></div>
<div class="footer">© 2026 Премиум Маркет. Все права защищены.</div>
<script>
const API="https://lyra-15172d69.base44.app/functions/r1Proxy?path=/api/v1";
async function load(){try{const r=await fetch(API+"/Item");const items=await r.json();const c=document.getElementById("catalog");c.innerHTML="";items.filter(i=>i.in_stock).slice(0,24).forEach(i=>{const d=document.createElement("div");d.className="card";d.innerHTML=`${i.photo_url?`<img src="https://vlvc.ru${i.photo_url}" loading="lazy" alt="${i.name}">`:""}`+`<h3>${i.name}</h3><span class="badge">${i.category||"Товар"}</span>`+`${i.brand?`<span class="badge">${i.brand}</span>`:""}`+`<p>${i.description||""}</p><div class="price">${i.price}\u20bd</div>${i.old_price?`<span class="old">${i.old_price}\u20bd</span>`:""}`;c.appendChild(d);});}catch(e){console.error(e);document.getElementById("catalog").innerHTML="<div class=loading>Каталог временно недоступен.</div>";}}
load();
</script>
</body>
</html>
